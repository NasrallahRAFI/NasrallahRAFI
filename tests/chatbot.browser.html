<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot browser checks</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 2rem; background: #111827; color: #f9fafb; }
    #status { white-space: pre-wrap; font-family: ui-monospace, monospace; }
    .pass { color: #86efac; } .fail { color: #fca5a5; }
    iframe { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <h1>Chatbot browser checks</h1>
  <div id="status">Running…</div>
  <iframe id="fixture" title="chatbot test fixture"></iframe>
  <script>
    const status = document.getElementById('status');
    const fixture = document.getElementById('fixture');
    const results = [];
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const pass = (name, condition, detail = '') => {
      results.push({ name, ok: Boolean(condition), detail });
    };
    const frameDoc = () => fixture.contentDocument;
    const frameWin = () => fixture.contentWindow;

    async function load(url) {
      await new Promise((resolve, reject) => {
        fixture.onload = resolve;
        fixture.onerror = reject;
        fixture.src = url;
      });
      await wait(1200);
    }

    async function loadWithStoredState(url, state) {
      await new Promise((resolve) => {
        fixture.onload = resolve;
        fixture.src = 'about:blank';
      });
      fixture.contentWindow.localStorage.setItem('nr-chatbot-state-v1', JSON.stringify(state));
      await load(url);
    }

    async function run() {
      await load('../index.html?chatbot-test=1');
      const doc = frameDoc();
      const win = frameWin();
      pass('widget mounts once', doc.querySelectorAll('#chatbot-container').length === 1);
      const toggle = doc.getElementById('chatbot-toggle-btn');
      const chat = doc.getElementById('chatbot-window');
      const input = doc.getElementById('chatbot-input');
      toggle.click();
      pass('open', toggle.getAttribute('aria-expanded') === 'true' && !chat.classList.contains('hidden'));
      doc.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      await wait(350);
      pass('Escape closes', toggle.getAttribute('aria-expanded') === 'false' && chat.classList.contains('hidden'));
      toggle.click();
      doc.getElementById('chatbot-close-btn').click();
      toggle.click();
      pass('rapid close/reopen', toggle.getAttribute('aria-expanded') === 'true' && !chat.classList.contains('hidden'));
      const focusables = [...chat.querySelectorAll('button:not([disabled]), a[href], textarea:not([disabled])')].filter((el) => el.offsetParent !== null);
      focusables.at(-1).focus();
      doc.dispatchEvent(new KeyboardEvent('keydown', { key: 'Tab', bubbles: true }));
      pass('focus trap keeps focus in dialog', chat.contains(doc.activeElement));
      win.localStorage.setItem('nr-chatbot-state-v1', '{invalid');
      await load('../index.html?chatbot-test=corrupt');
      pass('corrupted localStorage is discarded', !frameWin().localStorage.getItem('nr-chatbot-state-v1') || frameDoc().getElementById('chatbot-greeting'));
      const history = Array.from({ length: 50 }, (_, index) => ({ role: index % 2 ? 'assistant' : 'user', content: `turn ${index}` }));
      await loadWithStoredState('../index.html?chatbot-test=cap', { history, savedAt: Date.now() });
      const cappedState = JSON.parse(frameWin().localStorage.getItem('nr-chatbot-state-v1') || '{"history":[]}');
      pass('history cap is 40 turns', cappedState.history.length === 40, `got ${cappedState.history.length}`);
      await load('../index-fr.html?chatbot-test=fr');
      pass('French localization is selected', frameDoc().documentElement.lang === 'fr' && frameDoc().getElementById('chatbot-input').getAttribute('aria-label') === 'Message');
      await loadWithStoredState('../project-smart-bms.html?chatbot-test=suggestions', { history: [], savedAt: Date.now() });
      frameDoc().getElementById('chatbot-toggle-btn').click();
      pass('page-specific suggestions are present', frameDoc().querySelector('[data-prompt="Explain the BMS architecture"]') !== null);
      const online = Object.getOwnPropertyDescriptor(frameWin().Navigator.prototype, 'onLine');
      Object.defineProperty(frameWin().navigator, 'onLine', { configurable: true, value: false });
      frameWin().dispatchEvent(new Event('offline'));
      pass('offline state is announced', !frameDoc().getElementById('chatbot-offline-banner').classList.contains('hidden'));
      if (online) Object.defineProperty(frameWin().Navigator.prototype, 'onLine', online);
      delete frameWin().navigator.onLine;
      frameWin().dispatchEvent(new Event('online'));
      frameWin().localStorage.removeItem('nr-chatbot-state-v1');
      await loadWithStoredState('../index.html?chatbot-test=api', { history: [], savedAt: Date.now() });
      const apiWin = frameWin();
      const apiDoc = frameDoc();
      apiWin.fetch = async (url) => ({
        ok: true,
        status: 200,
        json: async () => url.includes('/health') ? { status: 'ok' } : { reply: '**stub reply**' }
      });
      apiDoc.getElementById('chatbot-toggle-btn').click();
      const apiInput = apiDoc.getElementById('chatbot-input');
      apiInput.value = 'Test the assistant';
      apiDoc.getElementById('chatbot-form').dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
      await wait(1200);
      const replyText = apiDoc.querySelector('.chatbot-ai-row .chat-markdown')?.textContent || '';
      pass('API success state renders a reply', replyText.includes('stub reply'));
      const regenerate = apiDoc.querySelector('[data-regenerate]');
      pass('regenerate action is available', Boolean(regenerate));
      const copyButton = apiDoc.querySelector('.chatbot-msg-action-btn');
      apiWin.navigator.clipboard = undefined;
      apiDoc.execCommand = () => true;
      if (copyButton) copyButton.click();
      await wait(50);
      pass('clipboard fallback reports copied', copyButton?.textContent.includes('Copied'));
      const failed = results.filter((result) => !result.ok);
      status.innerHTML = results.map((result) => `<div class="${result.ok ? 'pass' : 'fail'}">${result.ok ? 'PASS' : 'FAIL'} — ${result.name}${result.detail ? `: ${result.detail}` : ''}</div>`).join('');
      document.title = failed.length ? `FAIL (${failed.length}) — Chatbot browser checks` : 'PASS — Chatbot browser checks';
      if (failed.length) throw new Error(`${failed.length} browser checks failed`);
    }

    run().catch((error) => {
      status.innerHTML += `<div class="fail">FAIL — ${error.message}</div>`;
      document.title = 'FAIL — Chatbot browser checks';
    });
  </script>
</body>
</html>
